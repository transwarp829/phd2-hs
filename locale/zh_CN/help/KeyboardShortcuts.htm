<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>键盘快捷键</title></head>
<body>
<h2>PHD2 键盘快捷键表</h2>
<table>
<tbody><tr><td><u>快捷键</u></td><td><u>功能</u></td></tr>
<tr><td>F1</td><td>帮助</td></tr>
<tr><td>Ctrl-C</td><td>打开连接设备窗口</td></tr>
<tr><td>Shift-Ctrl-C</td><td>连接所有设备</td></tr>
<tr><td>Ctrl-L</td><td>循环曝光</td></tr>
<tr><td>Alt-S</td><td>自动选星</td></tr>
<tr><td>Ctrl-G</td><td>开始导星</td></tr>
<tr><td>Ctrl-S</td><td>停止</td></tr>
<tr><td>Ctrl-D</td><td>关闭提示</td></tr>
<tr><td>Alt-C</td><td>查看校准</td></tr>
<tr><td>Ctrl-O</td><td>清除校准（强制重新校准）</td></tr>
<tr><td>Ctrl-A</td><td>打开高级设置</td></tr>
<tr><td>B</td><td>显示或隐藏书签</td></tr>
<tr><td>Ctrl-B</td><td>删除全部书签</td></tr>
<tr><td>Shift-B</td><td>为锁定位置添加书签</td></tr>
<tr><td>Shift-Ctrl-M</td><td>输入手动校准</td></tr><tr><td>Shift-Click</td><td>强制显示完整画幅</td></tr>
</tbody></table>
</body></html>
